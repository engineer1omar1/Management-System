<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Managment System</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <!-- Main Div To All Element -->
    <div class="crud">
        <div class="head">
            <h2>CRUDS</h2>
            <span>PRODUCT MANAGEMENT SYSTEM</span>
        </div>
        <div class="inputs">
            <input type="text" placeholder="title" id="title">
            <div class="pricetotal">
                <input onkeyup="totalElemetn()" type="number" name="" id="price" placeholder="price">
                <input onkeyup="totalElemetn()" type="number" name="" id="taxes" placeholder="taxes">
                <input onkeyup="totalElemetn()" type="number" name="" id="ads" placeholder="ads">
                <input onkeyup="totalElemetn()" type="number" name="" id="discount" placeholder="discount">
                <div class="total">Total : <span></span></div>
            </div>
            <input type="number" id="count" placeholder="count">
            <input type="text" id="category" placeholder="category">
            <button id="submit">Create</button>
        </div>
        <div class="outputs">
            <div class="searchblocks">
                <input onkeyup="searchData(this.value)" type="search" name="" id="search" placeholder="search">
                <div class="btnsearch">
                    <button onclick="getSearchMood(this.id)" id="search-title">Search By Title</button>
                    <button onclick="getSearchMood(this.id)" id="search-category">Search By Category</button>
                </div>
            
            </div>
            <button class="delete-all">Delete All (<span>0</span>)</button>
            <table>
                <thead>
                    <tr>
                    <th>ID</th>
                    <th>TITLE</th>
                    <th>PRICE</th>
                    <th>TAXES</th>
                    <th>ADS</th>
                    <th>DISCOUNT</th>
                    <th>TOTAL</th>
                    <th>COUNT</th>
                    <th>CATEGORY</th>
                    <th>UPDATE</th>
                    <th>DELETE</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
            
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
